<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moshe Azaria - CV</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
        .cv-viewer {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .cv-content {
            background: var(--terminal-bg);
            border: 2px solid var(--terminal-accent);
            border-radius: 8px;
            padding: 20px;
            white-space: pre-wrap;
            font-family: "JetBrains Mono", "Courier New", monospace;
            font-size: 12px;
            line-height: 1.4;
            color: var(--terminal-text);
            overflow-x: auto;
            margin-bottom: 20px;
        }
        
        .cv-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }
        
        .cv-btn {
            background: transparent;
            border: 2px solid var(--terminal-accent);
            color: var(--terminal-accent);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
        }
        
        .cv-btn:hover {
            background: var(--terminal-accent);
            color: var(--terminal-bg);
            box-shadow: 0 0 20px var(--terminal-accent);
        }
        
        .cv-btn.secondary {
            border-color: var(--terminal-dim);
            color: var(--terminal-dim);
        }
        
        .cv-btn.secondary:hover {
            background: var(--terminal-dim);
            color: var(--terminal-bg);
            box-shadow: 0 0 20px var(--terminal-dim);
        }
        
        .header-info {
            text-align: center;
            margin-bottom: 30px;
            color: var(--terminal-accent);
        }
        
        .header-info h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header-info p {
            color: var(--terminal-dim);
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .cv-viewer {
                padding: 10px;
            }
            
            .cv-content {
                padding: 15px;
                font-size: 11px;
            }
            
            .cv-actions {
                flex-direction: column;
            }
            
            .cv-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="cv-viewer">
        <div class="header-info">
            <h1>CV Viewer</h1>
            <p>Terminal-formatted resume ready for download</p>
        </div>
        
        <div class="cv-content" id="cv-content">
            Loading CV...
        </div>
        
        <div class="cv-actions">
            <a href="/" class="cv-btn secondary">← Back to Portfolio</a>
            <button id="download-cv" class="cv-btn">Download CV.txt</button>
        </div>
    </div>

    <script>
        // Load and display CV content
        async function loadCV() {
            try {
                const response = await fetch('/resources/cv.txt');
                const cvText = await response.text();
                document.getElementById('cv-content').textContent = cvText;
            } catch (error) {
                document.getElementById('cv-content').textContent = 'Error loading CV. Please try again later.';
                console.error('Failed to load CV:', error);
            }
        }

        // Download CV function
        function downloadCV() {
            const link = document.createElement('a');
            link.href = '/resources/cv.txt';
            link.download = 'Moshe_Azaria_CV.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadCV();
            document.getElementById('download-cv').addEventListener('click', downloadCV);
        });
    </script>
</body>
</html>
